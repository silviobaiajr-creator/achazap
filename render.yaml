services:
  - type: web
    name: achazap
    runtime: docker
    plan: free # Define o plano gratuito
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # As chaves abaixo devem ser preenchidas no painel do Render
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BASE_URL
        sync: false # Ex: https://achazap.onrender.com
    healthCheckPath: /health
